<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRC Hispano Client</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      console.log('🚀 Script iniciado');
      const origError = console.error;
      console.error = function(...args) {
        document.body.innerHTML += '<p style="color:red;white-space:pre;font-family:monospace;">' + args.join(' ') + '</p>';
        origError.apply(console, args);
      };
      window.onerror = function(msg, url, line, col, err) {
        const text = `ERROR: ${msg}\nat ${url}:${line}:${col}\n${err?.stack || ''}`;
        console.error(text);
        return true;
      };
      window.onunhandledrejection = function(event) {
        const text = `UNHANDLED REJECTION: ${event.reason}`;
        console.error(text);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
